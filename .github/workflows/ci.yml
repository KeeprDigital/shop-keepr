name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalogue-contract:
    name: Catalogue contract is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates from the committed document and fails if the committed
      # output differs (ADR 0013).
      - run: pnpm catalogue:contract:check
